	<script>
		fetch('photos.json')
			.then(res => res.json())
			.then(photos => {
				const gallery = document.getElementById('portfolio-gallery');

				photos.forEach(photo => {
					const tags = photo.tags || [];
					const tagClasses = tags.join(' ');

					const div = document.createElement('div');
					div.className = `mix col-xl-2 col-md-3 col-sm-4 col-6 p-0 ${tagClasses}`;

					div.innerHTML = `<a href="${photo.img}" class="portfolio-item img-popup set-bg" data-setbg="${photo.img}"></a>`;

					gallery.appendChild(div);
				});

				initPortfolio();
			});

		function initPortfolio() {
			$('.set-bg').each(function () {
				var bg = $(this).data('setbg');
				$(this).css('background-image', 'url(' + bg + ')');
			});

			$('.portfolio-item').each(function () {
				$(this).css('height', $(this).width());
			});

			$('.img-popup').magnificPopup({
				type: 'image',
				mainClass: 'img-popup-warp',
				removalDelay: 500,
			});

			var containerEl = document.querySelector('.portfolio-gallery');
			if (containerEl) {
				var mixer = mixitup(containerEl, {
					selectors: {
						control: '.control'
					},
					animation: {
						duration: 600
					}
				});
			}
		}
	</script>
