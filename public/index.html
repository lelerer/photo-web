	<script>
		const DEFAULT_TITLE = "Take a look at my Portfolio";

		fetch('photos.json')
			.then(res => res.json())
			.then(photos => {
				const heroSection = document.getElementById('hero-section');

				const rows = {};
				photos.forEach(p => {
					if (!rows[p.row]) rows[p.row] = [];
					rows[p.row].push(p);
				});

				Object.keys(rows).sort((a, b) => a - b).forEach(rowKey => {
					const slider = document.createElement('div');
					slider.className = 'hero-slider owl-carousel';

					rows[rowKey].forEach(photo => {
						const title = photo.title || DEFAULT_TITLE;
						const item = document.createElement('div');
						item.className = 'hero-item portfolio-item set-bg';
						item.setAttribute('data-setbg', photo.img);
						item.innerHTML = `<a href="${photo.link}" class="hero-link"><h2>${title}</h2></a>`;
						slider.appendChild(item);
					});

					heroSection.appendChild(slider);
				});

				initHero();
			});

		function initHero() {
			$('.set-bg').each(function () {
				var bg = $(this).data('setbg');
				$(this).css('background-image', 'url(' + bg + ')');
			});

			$('.hero-slider').owlCarousel({
				nav: false,
				dots: false,
				loop: true,
				autoplay: true,
				smartSpeed: 1000,
				responsive: {
					0: { items: 1 },
					480: { items: 2 },
					768: { items: 3 },
					991: { items: 4 },
					1200: { items: 5 },
					1400: { items: 7 }
				}
			});

			$('.portfolio-item').each(function () {
				$(this).css('height', $(this).width());
			});
		}
	</script>
